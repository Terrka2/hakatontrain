name: check-paths
on:
  pull_request:
    branches: [dev, "pair/**"]
jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_paths.py --branch "$GITHUB_HEAD_REF" --base "origin/$GITHUB_BASE_REF"
